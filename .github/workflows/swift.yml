name: swift

on: [push]

jobs:
  build-macos:

    runs-on: macos-15
    steps:
      - uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v3
        with:
          go-version: "1.24"

      - name: Test
        run: cd swift && make test

      - name: iOS
        run: cd swift && make ios-fat

      - name: macos 
        run: cd swift && make macos 

  build-linux:

    runs-on: ubuntu-latest
    container: swift:6.3
    steps:
      - uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.5"

      - name: Install cross toolchains
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential gcc-x86-64-linux-gnu gcc-aarch64-linux-gnu

      - name: Test
        run: cd swift && make test-spm
